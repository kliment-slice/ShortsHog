# One file per event. Raw footage stays in `content`; this folder holds only
# pipeline files (transcripts/, shorts.json, renders/).
event: _template
date:            # YYYY-MM-DD
content: content/EVENT_FOLDER      # raw footage folder, relative to the repo root
fps:             # optional override; /cut reads fps from each master otherwise

# Media paths below are relative to `content`.
broll:                             # folders and/or files searched for broll_hint matches
  - B-roll

panels:
  - id: panel1                       # short slug, used in transcripts/<id>.json and short ids
    master: "panel1 master.mov"      # synced master exported from Resolve
    granola_meeting: ""              # exact Granola meeting title
    mics:                            # one entry per raw mic track
      - file: "Audio Recordings/Mic 1-1.wav"
        speaker: ""
      - file: "Audio Recordings/Mic 2-1.wav"
        speaker: ""
    # Static 9:16 framing per speaker, filled in on the first /cut.
    # Values are Resolve timeline-item properties on a 1080x1920 timeline.
    crops: {}
      # "Speaker Name": {zoom: 1.0, pan: 0, tilt: 0}
