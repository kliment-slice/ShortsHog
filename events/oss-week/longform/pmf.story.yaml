# Story beats for the PMF long form. Times are panel time (seconds from the panel's start,
# the same clock as transcripts/pmf.json), so they survive changes to the edit.
#
# questions: a chapter tag that stays on screen until the next question. `t` = when the host
#            starts asking. A question without `n` is unnumbered (e.g. the introductions).
# anchors:   a popup summary of a strong point; `t` = when the speaker starts the sentence that makes it,
#            so the card appears while they're still on screen.
# Each new question or anchor is a theme change: it gets the PostHog stripe wipe.

questions:
  - {t: 34.7, label: "Meet the panel", text: "Finding PMF through open source"}
  - {t: 221.4, n: 1, text: "The exact moment you knew you had PMF"}
  - {t: 415.0, n: 2, text: "Your users are agents now: does reaching PMF change?"}
  - {t: 647.8, n: 3, text: "Does open source help find PMF, or is it for investors?"}
  - {t: 865.1, n: 4, text: "How do you measure revenue when the code is free?"}
  - {t: 1009.7, n: 5, text: "Hot takes: should you launch open source?"}

anchors:
  - {t: 107.7, speaker: Yonas Beshawred, text: "GitHub Actions up to 10x faster, with AI agents tuning your CI"}
  - {t: 138.8, speaker: Hang Huang, text: "A sandbox tested in a week went viral before it was open sourced"}
  - {t: 174.5, speaker: Shengkun Ye, text: "Monid is the open router for agent tools"}
  - {t: 249.6, speaker: Shengkun Ye, text: "PMF was the moment our users got mad at us"}
  - {t: 336.3, speaker: Hang Huang, text: "First signal: users asking how to self-host it"}
  - {t: 397.0, speaker: Yonas Beshawred, text: "CI is free for open source. Paying anyway means real pain."}
  - {t: 455.9, speaker: Hang Huang, text: "Open source gets you baked into what agents recommend"}
  - {t: 530.0, speaker: Yonas Beshawred, text: "Claude picks GitHub Actions 97% of the time, so we started there"}
  - {t: 591.6, speaker: Shengkun Ye, text: "Agents tell users: Monid is open source, use that"}
  - {t: 620.4, speaker: Hang Huang, text: "At 500 stars agents didn't trust us. At 10K: pretty legit."}
  - {t: 661.7, speaker: Yonas Beshawred, text: "Skills are a free, low-friction way in"}
  - {t: 736.6, speaker: Hang Huang, text: "Stars are vanity. Watch star-to-fork ratio and live self-hosts."}
  - {t: 836.8, speaker: Shengkun Ye, text: "Open sourcing made suppliers send their own PRs"}
  - {t: 891.7, speaker: Shengkun Ye, text: "Agents do the integration. The value is pricing and unified billing."}
  - {t: 938.7, speaker: Hang Huang, text: "Make self-hosting cost more than your managed version"}
  - {t: 988.1, speaker: Yonas Beshawred, text: "Free to fork, but enterprises pay for security and availability"}
  - {t: 1032.1, speaker: Hang Huang, text: "Code gets reverse engineered anyway. Put it out there."}
  - {t: 1082.4, speaker: Shengkun Ye, text: "AI makes anything easy to copy. Pick what finds you PMF."}
  - {t: 1105.4, speaker: Yonas Beshawred, text: "The exception is compute: people pay for servers"}

# cuts: moments that don't serve the story (mic checks, setup chatter, stray asides), removed
#       with their captions. `from` / `to` are transcript text: the cut runs from the first word of
#       `from` to the last word of the first `to` after it.
cuts:
  - {from: "if it's a .", to: "if it's a .", why: "stray words before the intro"}
  - {from: "Through finding your GTM motions, figuring out", to: "as beautiful as infinite adoption.", why: "recap of the evening over the walk-on"}
  - {from: "hope you guys are doing well", to: "amazing day to be honest today.", why: "small talk"}

# wide_only: spans (panel time) that stay on the wide camera, e.g. while someone walks right past cam2.
wide_only:
  - {from: 9.3, to: 12.7}   # a passer-by fills cam2

# shorts: candidate 3:4 shorts (shortform.py). Only specs with a `hook` render; the rest carry a
#         `rejected` reason (FORMAT.md "### Selection"). `hook` is the hot take the short opens on,
#         `from` / `to` the meat (setup and qualifier included), `payoff` the sentence it ends on, `skip` phrases are cut.
shorts:
  - id: pmf-starsling-10x-ci
    speaker: Yonas Beshawred
    anchor: "GitHub Actions up to 10x faster, with AI agents tuning your CI"
    from: "My name's Yonas"
    to: "check out StarSling."
    rejected: 'pitch: intro, company or product description'
  - id: pmf-viral-sandbox
    speaker: Hang Huang
    anchor: "A sandbox tested in a week went viral before it was open sourced"
    from: "Hey everyone, I'm Hang"
    to: "finding PMF with my previous products."
    rejected: 'pitch: intro, company or product description'
  - id: pmf-monid-open-router
    speaker: Shengkun Ye
    anchor: "Monid is the open router for agent tools"
    from: "Hey everyone, I'm Shengkun"
    to: "And yes, we are open source."
    rejected: 'pitch: intro, company or product description'
  - id: pmf-users-got-mad
    speaker: Shengkun Ye
    anchor: "PMF was the moment our users got mad at us"
    title_key: "our users got mad at us"
    color: coral
    post:
      text: |-
        Shengkun Ye knew Monid had product-market fit when its users got mad at it.

        After a month with no feedback at all, they made the positioning clearer. Then came long emails about why the product sucks. "We are solving a real problem."
    key: "so mad at us"
    parts:
      - {from: "it was the moment that our users were so mad at us.", to: "really care about the problem you're solving."}
      - {from: "we got really long like a user email", to: "really solve that problem really well and at all"}
      - {from: "But before that, like, we actually have at least one month", to: "could not get any user feedback."}
      - {from: "And after that, we make some changes", to: "we are solving a real problem."}
  - id: pmf-self-host-inbound
    speaker: Hang Huang
    anchor: "First signal: users asking how to self-host it"
    title_key: "how to self-host it"
    color: blue
    post:
      text: |-
        Hang Huang's first sign InsForge was working wasn't GitHub stars.

        It was users writing in to say the self-hosting instructions in the README were really bad, and asking how to get it running.
    key: "cooking my first version"
    parts:
      - {from: "I was cooking my first version of the product", to: "on my local laptop and it's working."}
      - {from: "I just like open source it", to: "this product somehow is working"}
  - id: pmf-free-ci-still-paid
    speaker: Yonas Beshawred
    anchor: "CI is free for open source. Paying anyway means real pain."
    title_key: "Paying anyway means real pain."
    color: violet
    post:
      text: |-
        Open source projects get CI for free. So when Better Auth moved to StarSling's runners anyway, Yonas Beshawred knew it was a real pain point.

        That was StarSling's first sign of product-market fit.
    key: "first signs of product market fit"
    parts:
      - {from: "we saw the first signs of product market fit", to: "because it's free, right?"}
      - {from: "If you're an open source project, you get CI for free.", to: "you're willing to pay money for it"}
  - id: pmf-baked-into-agents
    speaker: Hang Huang
    anchor: "Open source gets you baked into what agents recommend"
    title_key: "baked into what agents recommend"
    color: green
    post:
      text: |-
        Hang Huang thinks people underestimate open source as a distribution channel for agents.

        Ask an agent for the best tool for a job and it answers from its training data. Forks, contributions, and people talking about you add weight there. That's how you become a default answer.
    key: "underestimate how good it is"
    parts:
      - {from: "people underestimate how good it is", to: "one of the default solutions."}
  - id: pmf-what-claude-picks
    speaker: Yonas Beshawred
    anchor: "Claude picks GitHub Actions 97% of the time, so we started there"
    title_key: "97% of the time"
    color: tangerine
    post:
      text: |-
        Ask Claude for a CI tool and it picks GitHub Actions about 97% of the time, according to a report Yonas Beshawred saw. So StarSling started there.

        Even if your product isn't for agents, you're building for humans and agents at the same time.
    key: "in the training set"
    hook: if you have SEO, then you'll be in the training set, and then you'll be recommended, and it's just a loop, right?
    from: someone put out this report
    to: so you kind of have to account for both.
    skip:  # keep "clearly there's one place you should start, which is GitHub Actions": the summary says so
      - so we were thinking like, you know, the proper way to do CI, you kind of have an engine that does aggressive caching and test selection, but, you know, we saw that and we were like, okay, well,
      - so I think even if you're not,
    payoff: building for humans and agents at the same time
    beats:
      - kind: topic_shift
        at: what Claude picks or what Claude chooses
        tags:
          - AI
          - choice
        query: artificial intelligence
        asset: overlays/pixabay-203987.mp4
        pos: [0.243, 0.684]
      - kind: stat
        at: 97% market share
        tags:
          - market share
          - chart
        query: pie chart
        asset: overlays/pixabay-95497.mp4
        size: 0.45
        pos: [0.288, 0.656]
  - id: pmf-agents-compare
    speaker: Shengkun Ye
    anchor: "Agents tell users: Monid is open source, use that"
    title_key: "Monid is open source, use that"
    color: purple
    post:
      text: |-
        Shengkun Ye's users now ask their agents to compare Monid with its competitors.

        The agents bring up whether you're open source and how many GitHub stars you have, then tell their humans: Monid is open source, so you can probably use that.
    key: "compare you with your competitors"
    parts:
      - {from: "what we found out from our users is that", to: "so you probably can use that"}
  - id: pmf-500-vs-10k-stars
    speaker: Hang Huang
    anchor: "At 500 stars agents didn't trust us. At 10K: pretty legit."
    title_key: "At 10K: pretty legit."
    color: cobalt
    post:
      text: |-
        At 500 GitHub stars, agents told people they wouldn't trust InsForge. A year later, at 10K stars: "this product is pretty legit."

        Hang Huang's verdict: "the agents, they're not that smart."
    key: "not that smart"
    hook: the agents, they're not that smart, right?
    from: we started as a 500 stars
    to: this product is pretty legit.
    payoff: this product is pretty legit
    beats:
      - kind: stat
        at: 10k stars
        tags:
          - stars
          - rating
        query: stars sparkle
        asset: overlays/pixabay-19478.mp4
        clip_in: 3.5
        pos: [0.243, 0.684]
  - id: pmf-skills-entry-point
    speaker: Yonas Beshawred
    anchor: "Skills are a free, low-friction way in"
    title_key: "low-friction way in"
    color: corn_blue
    post:
      text: |-
        StarSling released skills, and Yonas Beshawred says they've become a really great way for people to discover it.

        They're free and low friction: you speed up your own CI with the skill in your own agent, without signing up. A year ago that wasn't a go-to-market strategy.
    key: "released skills"
    parts:
      - {from: "we've released skills", to: "a really great way for people to discover us."}
      - {from: "skills have actually become a really interesting entry point", to: "without having to sign up for it necessarily."}
      - {from: "It wasn't really a real go-to-market strategy", to: "use the skill in your own agent."}
  - id: pmf-star-to-fork
    speaker: Hang Huang
    anchor: "Stars are vanity. Watch star-to-fork ratio and live self-hosts."
    headline: "Don't just count stars. Watch star-to-fork ratio and live self-hosts."
    title_key: "star-to-fork ratio"
    color: coral
    post:
      text: |-
        Hang Huang doesn't just count GitHub stars. InsForge watches its star-to-fork ratio, because forks show how many developers actually try it.

        Check-ins sent to PostHog show versions and setups, and heartbeats count the live self-hosted copies.
    key: "built for investors"
    parts:
      - {from: "I personally don't think stars is something built for investors", to: "how many developers are actually using them"}
      - {from: "we're also using some signal check-ins combined with PostHog", to: "how many live self-hosted versions are out there."}
    # headline: the long form's "Stars are vanity" is stronger than he put it
  - id: pmf-suppliers-send-prs
    speaker: Shengkun Ye
    anchor: "Open sourcing made suppliers send their own PRs"
    title_key: "send their own PRs"
    color: blue
    post:
      text: |-
        Before Monid was open source, Shengkun Ye's team integrated every tool provider by hand.

        After open sourcing it, providers started sending their own PRs: "I really want to be listed on Monid. I already submitted my PR. Can you please review it?"
    key: "really help us with the PMF"
    parts:
      - {from: "open source for us really help us with the PMF.", to: "open source for us really help us with the PMF."}
      - {from: "what we are not sure is that like how much leverage", to: "on our suppliers side."}
      - {from: "at that time we did all the manual integration", to: "Can you please review it?"}
      - {from: "that was the point i realized", to: "suppliers also love us really well as well"}
  - id: pmf-unified-billing
    speaker: Shengkun Ye
    anchor: "Agents do the integration. The value is pricing and unified billing."
    title_key: "pricing and unified billing."
    color: green
    post:
      text: |-
        Agents make integration work easy now, says Shengkun Ye, so that's not where Monid's value is.

        It's the pricing and unified billing behind the scenes, which you only get from the hosted version, not the open source project.
    key: "integration work"
    parts:
      - {from: "agents are so easy to do all the integration work.", to: "agents are so easy to do all the integration work."}
      - {from: "our values here is not like help you to easily integrate", to: "not able to get directly from our open source project"}
      - {from: "if you actually want to use it and fill the values out of it", to: "you need to use the hosted version."}
  - id: pmf-self-host-costs-more
    speaker: Hang Huang
    anchor: "Make self-hosting cost more than your managed version"
    title_key: "cost more than your managed version"
    color: tangerine
    post:
      text: |-
        Hang Huang's monetization strategy: make the open source project a full experience.

        Running it in production needs observability, replicas, availability, and compliance, so self-hosting ends up costing more than the managed version. "Why wouldn't I use you?"
    key: "clear strategy for monetization"
    parts:
      - {from: "there is a clear strategy for monetization", to: "that's kind of the strategy we've took"}
  - id: pmf-enterprise-pays
    speaker: Yonas Beshawred
    anchor: "Free to fork, but enterprises pay for security and availability"
    title_key: "enterprises pay"
    color: violet
    post:
      text: |-
        Open source, and still paid for: Yonas Beshawred points to Mastra, a StarSling customer. You can use it and fork it for free.

        Enterprises pay anyway for security and availability, because they'd rather spend their own people on other things.
    key: "also open source"
    parts:
      - {from: "one of our other customers is also open source", to: "spend your internal resources on other things."}
  - id: pmf-put-your-code-out
    speaker: Hang Huang
    anchor: "Code gets reverse engineered anyway. Put it out there."
    title_key: "Put it out there."
    color: purple
    post:
      text: |-
        Closed or open, your code gets reverse engineered anyway, says Hang Huang. So put it out there.

        If a developer sees a project is open source, they'll try it and self-host it, and if it's good they'll contribute. "I would definitely vouch for open source."
    hook: "I would definitely vouch for open source."
    key: "vouch for open source"
    parts:  # Hang's reasoning. Shengkun's PRs story (836.8 to 856.5) made it 56s: over the 45s limit
      - {from: "you guys probably using something", to: "much better than a closed source version,"}
  - id: pmf-easy-to-copy
    speaker: Shengkun Ye
    anchor: "AI makes anything easy to copy. Pick what finds you PMF."
    title_key: "Pick what finds you PMF."
    color: cobalt
    post:
      text: |-
        With AI agents, anything you build is easy to copy, open source or not, says Shengkun Ye.

        So pick whatever finds you product-market fit. If closed source does, go for it. If you're not sure, do both.
    key: "so easy to copy"
    parts:
      - {from: "especially right now, because of the AI agents", to: "you can just do both of them."}
  - id: pmf-compute-exception
    speaker: Yonas Beshawred
    anchor: "The exception is compute: people pay for servers"
    title_key: "people pay for servers"
    color: corn_blue
    post:
      text: |-
        Yonas Beshawred agrees: open source it. The one exception is compute.

        Anyone can run CI on their laptop. What you really need is a lot of servers and vCPUs, and that's still something people pay for.
    key: "has to do with compute"
    parts:
      - {from: "The only exception is if what you're building has to do with compute", to: "compute is still something that you want to pay for generally"}
