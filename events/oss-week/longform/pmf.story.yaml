# Story beats for the PMF long form. Times are panel time (seconds from the panel's start,
# the same clock as transcripts/pmf.json), so they survive changes to the edit.
#
# questions: a chapter tag that stays on screen until the next question. `t` = when the host
#            starts asking. A question without `n` is unnumbered (e.g. the introductions).
# anchors:   a popup summary of a strong point; `t` = when the speaker starts the sentence that makes it,
#            so the card appears while they're still on screen.
# Each new question or anchor is a theme change: it gets the PostHog stripe wipe.

questions:
  - {t: 34.7, label: "Meet the panel", text: "Finding PMF through open source"}
  - {t: 221.4, n: 1, text: "The exact moment you knew you had PMF"}
  - {t: 415.0, n: 2, text: "Your users are agents now: does reaching PMF change?"}
  - {t: 647.8, n: 3, text: "Does open source help find PMF, or is it for investors?"}
  - {t: 865.1, n: 4, text: "How do you measure revenue when the code is free?"}
  - {t: 1009.7, n: 5, text: "Hot takes: should you launch open source?"}

anchors:
  - {t: 107.7, speaker: Yonas Beshawred, text: "GitHub Actions up to 10x faster, with AI agents tuning your CI"}
  - {t: 138.8, speaker: Hang Huang, text: "A sandbox tested in a week went viral before it was open sourced"}
  - {t: 174.5, speaker: Shengkun Ye, text: "Monid is the open router for agent tools"}
  - {t: 249.6, speaker: Shengkun Ye, text: "PMF was the moment our users got mad at us"}
  - {t: 336.3, speaker: Hang Huang, text: "First signal: users asking how to self-host it"}
  - {t: 397.0, speaker: Yonas Beshawred, text: "CI is free for open source. Paying anyway means real pain."}
  - {t: 455.9, speaker: Hang Huang, text: "Open source gets you baked into what agents recommend"}
  - {t: 530.0, speaker: Yonas Beshawred, text: "Claude picks GitHub Actions 97% of the time, so we started there"}
  - {t: 591.6, speaker: Shengkun Ye, text: "Agents tell users: Monid is open source, use that"}
  - {t: 620.4, speaker: Hang Huang, text: "At 500 stars agents didn't trust us. At 10K: pretty legit."}
  - {t: 661.7, speaker: Yonas Beshawred, text: "Skills are a free, low-friction way in"}
  - {t: 736.6, speaker: Hang Huang, text: "Stars are vanity. Watch star-to-fork ratio and live self-hosts."}
  - {t: 836.8, speaker: Shengkun Ye, text: "Open sourcing made suppliers send their own PRs"}
  - {t: 891.7, speaker: Shengkun Ye, text: "Agents do the integration. The value is pricing and unified billing."}
  - {t: 938.7, speaker: Hang Huang, text: "Make self-hosting cost more than your managed version"}
  - {t: 988.1, speaker: Yonas Beshawred, text: "Free to fork, but enterprises pay for security and availability"}
  - {t: 1032.1, speaker: Hang Huang, text: "Code gets reverse engineered anyway. Put it out there."}
  - {t: 1082.4, speaker: Shengkun Ye, text: "AI makes anything easy to copy. Pick what finds you PMF."}
  - {t: 1105.4, speaker: Yonas Beshawred, text: "The exception is compute: people pay for servers"}

# cuts: moments that don't serve the story (mic checks, setup chatter, stray asides), removed
#       with their captions. `from` / `to` are transcript text: the cut runs from the first word of
#       `from` to the last word of the first `to` after it.
cuts:
  - {from: "if it's a .", to: "if it's a .", why: "stray words before the intro"}
  - {from: "Through finding your GTM motions, figuring out", to: "as beautiful as infinite adoption.", why: "recap of the evening over the walk-on"}
  - {from: "hope you guys are doing well", to: "amazing day to be honest today.", why: "small talk"}

# wide_only: spans (panel time) that stay on the wide camera, e.g. while someone walks right past cam2.
wide_only:
  - {from: 9.3, to: 12.7}   # a passer-by fills cam2

# shorts: anchor cards turned into 3:4 shorts (shortform.py). `from` / `to` are transcript text and
#         cover the speaker's whole thought; `skip` phrases inside the range are cut too.
