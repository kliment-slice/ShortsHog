# Story beats for the GTM long form. Times are panel time (seconds from the panel's start,
# the same clock as transcripts/gtm.json), so they survive changes to the edit.
#
# questions: a chapter tag that stays on screen until the next question. `t` = when the host
#            starts asking. A question without `n` is unnumbered (e.g. the introductions).
# anchors:   a popup summary of a strong point; `t` = when the speaker starts the sentence that makes it,
#            so the card appears while they're still on screen.
# Each new question or anchor is a theme change: it gets the PostHog stripe wipe.

questions:
  - {t: 23.7, label: "Meet the panel", text: "Who's here and what they build"}
  - {t: 158.0, n: 1, text: "Your first real users: how did you find them?"}
  - {t: 346.0, n: 2, text: "Biggest go-to-market win, and the flop"}
  - {t: 567.0, n: 3, text: "With AI, is open source still worth it for GTM?"}
  - {t: 785.0, n: 4, text: "Open source GTM wisdom you disagree with"}
  - {t: 1124.0, n: 5, text: "Will PRs disappear? Where open source goes next"}
  - {t: 1312.3, n: 6, text: "Starting today: how would you get your first 100 users?"}

anchors:
  - {t: 52.0, speaker: Tim Glaser, text: "Open source since day one, now ~700,000 users"}
  - {t: 88.5, speaker: Alex Jung, text: "Micro VMs, open core, born as a Linux Foundation project"}
  - {t: 136.8, speaker: John Simone, text: "11M downloads, ~500K monthly active users"}
  - {t: 190.0, speaker: Tim Glaser, text: "A few hundred dollars of Twitter ads to GitHub got the first 100 stars"}
  - {t: 215.6, speaker: Alex Jung, text: "The first users were students, found through university workshops"}
  - {t: 280.0, speaker: Alex Jung, text: "Kernel-grade code reviews won partners like ARM and Microsoft"}
  - {t: 324.5, speaker: John Simone, text: "In dev tools, unique gets tried. The work is keeping the buzz."}
  # Q2: biggest win, and the flop
  - {t: 372.2, speaker: Alex Jung, text: "Launch often: every new feature and every raise got its own launch"}
  - {t: 443.2, speaker: John Simone, text: "Blog content and an AI University series drove the early traction"}
  - {t: 497.3, speaker: John Simone, text: "Selling into the Fortune 500 as a small company was an uphill battle"}
  - {t: 547.6, speaker: Tim Glaser, text: "Giving away Nintendo 64s flopped. You can't bribe your customers."}
  # Q3: is open source still worth it for GTM
  - {t: 640.4, speaker: Tim Glaser, text: "Few people self-host PostHog, but knowing they can builds trust"}
  - {t: 721.4, speaker: Alex Jung, text: "Open core: the kernel is open, the cloud stays closed for security"}
  # Q4: wisdom they disagree with
  - {t: 824.5, speaker: Tim Glaser, text: "Contributions aren't the value of open source. Feedback is."}
  - {t: 839.2, speaker: Tim Glaser, text: "Open core failed for PostHog. Charging only for the cloud worked."}
  - {t: 915.4, speaker: Alex Jung, text: "Issues are worth more than pull requests"}
  - {t: 1030.1, speaker: Alex Jung, text: "In-person events beat AI-written outbound"}
  # Q5: where open source goes
  - {t: 1164.6, speaker: Alex Jung, text: "Maintaining software isn't free, and AI makes it cost real money"}
  - {t: 1253.7, speaker: John Simone, text: "Shared foundations like the Linux kernel matter more, not less"}
  # Q6: first 100 users, starting today
  - {t: 1350.5, speaker: Tim Glaser, text: "If Claude can build it in a day, why would anyone pay you for it?"}
  - {t: 1390.2, speaker: Tim Glaser, text: "Distribution is a moat. Find a hook that stands out."}
  - {t: 1435.3, speaker: Tim Glaser, text: "Be a forward-deployed engineer: solve people's problems for them"}
  - {t: 1537.1, speaker: John Simone, text: "Find the line between what's free and what people will pay for"}

# cuts: moments that don't serve the story (mic checks, setup chatter, stray asides), removed
#       with their captions. `from` / `to` are transcript text: the cut runs from the first word of
#       `from` to the last word of the first `to` after it.
cuts:
  - {from: "And Alex, Co-Founder of Unikraft", to: "Thank you. Cool, cool.", why: "handover from the previous intro"}
  - {from: "Great meeting everybody.", to: "We have a nice crowd here at the nice office.", why: "small talk"}
  - {from: "cool uh i'm tim is it working", to: "is it working um", why: "mic check"}
  - {from: "Is there a button for these?", to: "All right, hi.", why: "mic check"}
  - {from: "Test test.", to: "There we go.", why: "mic check"}
  - {from: "I think we have a very strong lineup today", to: "we have a lot of early stage founders.", why: "filler before the first question"}
  - {from: "Yeah, so...check?", to: "Alright.", why: "mic check"}
  - {from: "Give it a second.", to: "should have read the manual.", why: "mic help"}
  - {from: "You may be entitled", to: "You may be entitled, yeah.", why: "aside"}

# shorts: anchor cards turned into 3:4 shorts (shortform.py). `from` / `to` are transcript text and
#         cover the speaker's whole thought; `skip` phrases inside the range are cut too.
shorts:
  - id: gtm-nintendo-64s
    speaker: Tim Glaser
    anchor: "Giving away Nintendo 64s flopped. You can't bribe your customers."
    from: "The stuff that didn't work well"
    to: "Yeah, they work pretty well."
    skip: ["Cool, cool."]
  - id: gtm-issues-over-prs
    speaker: Alex Jung
    anchor: "Issues are worth more than pull requests"
    from: "I think definitely the most valuable thing"
    to: "even if you might have substantial tests."
    skip: ["So this is very, I think, very continuing."]
  - id: gtm-claude-in-a-day
    speaker: Tim Glaser
    anchor: "If Claude can build it in a day, why would anyone pay you for it?"
    from: "It's maybe not even like go-to-market"
    to: "what software makes sense to kind of try to sell."
  - id: gtm-posthog-700k
    speaker: Tim Glaser
    anchor: "Open source since day one, now ~700,000 users"
    from: "one of the co-founders and CEO of PostHog"
    to: "growing really quickly."
  - id: gtm-unikraft-linux-foundation
    speaker: Alex Jung
    anchor: "Micro VMs, open core, born as a Linux Foundation project"
    from: "I'm co-founder and chief of product at Unikraft."
    to: "built a cloud platform around that."
  - id: gtm-cline-11m-downloads
    speaker: John Simone
    anchor: "11M downloads, ~500K monthly active users"
    from: "Hey, I'm John Simone."
    to: "half a million active users monthly."
  - id: gtm-twitter-ads-to-github
    speaker: Tim Glaser
    anchor: "A few hundred dollars of Twitter ads to GitHub got the first 100 stars"
    from: "We actually did something kind of clever"
    to: "It's totally kind of net new."
  - id: gtm-first-users-students
    speaker: Alex Jung
    anchor: "The first users were students, found through university workshops"
    from: "we started off as research."
    to: "they were taking that course."
  - id: gtm-kernel-grade-reviews
    speaker: Alex Jung
    anchor: "Kernel-grade code reviews won partners like ARM and Microsoft"
    from: "At the time, also, before the whole AI takeover"
    to: "stable, understood, thought-out software."
  - id: gtm-unique-gets-tried
    speaker: John Simone
    anchor: "In dev tools, unique gets tried. The work is keeping the buzz."
    from: "So, Cline started at a hackathon"
    to: "we were successful in doing that."
  - id: gtm-launch-often
    speaker: Alex Jung
    anchor: "Launch often: every new feature and every raise got its own launch"
    from: "so we launch often, or at least at the beginning"
    to: "That worked really well."
  - id: gtm-ai-university
    speaker: John Simone
    anchor: "Blog content and an AI University series drove the early traction"
    from: "early early on for us blog content"
    to: "this is a lot of uptake here."
  - id: gtm-fortune-500-uphill
    speaker: John Simone
    anchor: "Selling into the Fortune 500 as a small company was an uphill battle"
    from: "that turned into getting inbound hearing from Fortune 500 companies"
    to: "a lot more friction there than we expected"
  - id: gtm-self-host-trust
    speaker: Tim Glaser
    anchor: "Few people self-host PostHog, but knowing they can builds trust"
    from: "Yeah, I think for us, it's a trust thing"
    to: "the benefit is obviously much, much less."
  - id: gtm-open-core-security
    speaker: Alex Jung
    anchor: "Open core: the kernel is open, the cloud stays closed for security"
    from: "We're open core and what that means"
    to: "the cloud platform of our customers as well."
  - id: gtm-feedback-over-contributions
    speaker: Tim Glaser
    anchor: "Contributions aren't the value of open source. Feedback is."
    from: "One that I used to hear more is that the value of open source"
    to: "other people can implement stuff in our software."
  - id: gtm-cloud-only-monetization
    speaker: Tim Glaser
    anchor: "Open core failed for PostHog. Charging only for the cloud worked."
    from: "In terms of go to market,"
    to: "word of mouth and usage for our cloud as well."
    skip: ["And I know now people do more like BYOC where they, I guess maybe that's what you do, but where you kind of bring in, you control it, but you're sort of in an account, so that might work better."]
  - id: gtm-events-beat-outbound
    speaker: Alex Jung
    anchor: "In-person events beat AI-written outbound"
    from: "But then on the whole GTM front"
    to: "than actually all this outbound stuff."
  - id: gtm-maintenance-costs
    speaker: Alex Jung
    anchor: "Maintaining software isn't free, and AI makes it cost real money"
    from: "I think there's a big question about maintainability."
    to: "Who's going to maintain this, right?"
  - id: gtm-shared-foundations
    speaker: John Simone
    anchor: "Shared foundations like the Linux kernel matter more, not less"
    from: "yeah I think there's"
    to: "on a stable base there"
  - id: gtm-distribution-moat
    speaker: Tim Glaser
    anchor: "Distribution is a moat. Find a hook that stands out."
    from: "I think distribution is a moat"
    to: "a hook that kind of makes sense and it's different."
  - id: gtm-forward-deployed
    speaker: Tim Glaser
    anchor: "Be a forward-deployed engineer: solve people's problems for them"
    from: "And then the last thing I think makes sense"
    to: "get the first couple of customers."
  - id: gtm-free-vs-paid
    speaker: John Simone
    anchor: "Find the line between what's free and what people will pay for"
    from: "Yeah, I think with open source, the most important thing"
    to: "in the niche where you are"
