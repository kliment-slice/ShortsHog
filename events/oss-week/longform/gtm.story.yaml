# Story beats for the GTM long form. Times are panel time (seconds from the panel's start,
# the same clock as transcripts/gtm.json), so they survive changes to the edit.
#
# questions: a chapter tag that stays on screen until the next question. `t` = when the host
#            starts asking. A question without `n` is unnumbered (e.g. the introductions).
# anchors:   a popup summary of a strong point; `t` = when the speaker starts the sentence that makes it,
#            so the card appears while they're still on screen.
# Each new question or anchor is a theme change: it gets the PostHog stripe wipe.

questions:
  - {t: 23.7, label: "Meet the panel", text: "Who's here and what they build"}
  - {t: 158.0, n: 1, text: "Your first real users: how did you find them?"}
  - {t: 346.0, n: 2, text: "Biggest go-to-market win, and the flop"}
  - {t: 567.0, n: 3, text: "With AI, is open source still worth it for GTM?"}
  - {t: 785.0, n: 4, text: "Open source GTM wisdom you disagree with"}
  - {t: 1124.0, n: 5, text: "Will PRs disappear? Where open source goes next"}
  - {t: 1312.3, n: 6, text: "Starting today: how would you get your first 100 users?"}

anchors:
  - {t: 52.0, speaker: Tim Glaser, text: "Open source since day one, now ~700,000 users"}
  - {t: 88.5, speaker: Alex Jung, text: "Micro VMs, open core, born as a Linux Foundation project"}
  - {t: 136.8, speaker: John Simone, text: "11M downloads, ~500K monthly active users"}
  - {t: 190.0, speaker: Tim Glaser, text: "A few hundred dollars of Twitter ads to GitHub got the first 100 stars"}
  - {t: 215.6, speaker: Alex Jung, text: "The first users were students, found through university workshops"}
  - {t: 280.0, speaker: Alex Jung, text: "Kernel-grade code reviews won partners like ARM and Microsoft"}
  - {t: 324.5, speaker: John Simone, text: "In dev tools, unique gets tried. The work is keeping the buzz."}
  # Q2: biggest win, and the flop
  - {t: 372.2, speaker: Alex Jung, text: "Launch often: every new feature and every raise got its own launch"}
  - {t: 443.2, speaker: John Simone, text: "Blog content and an AI University series drove the early traction"}
  - {t: 497.3, speaker: John Simone, text: "Selling into the Fortune 500 as a small company was an uphill battle"}
  - {t: 547.6, speaker: Tim Glaser, text: "Giving away Nintendo 64s flopped. You can't bribe your customers."}
  # Q3: is open source still worth it for GTM
  - {t: 640.4, speaker: Tim Glaser, text: "Few people self-host PostHog, but knowing they can builds trust"}
  - {t: 721.4, speaker: Alex Jung, text: "Open core: the kernel is open, the cloud stays closed for security"}
  # Q4: wisdom they disagree with
  - {t: 824.5, speaker: Tim Glaser, text: "Contributions aren't the value of open source. Feedback is."}
  - {t: 839.2, speaker: Tim Glaser, text: "Open core failed for PostHog. Charging only for the cloud worked."}
  - {t: 915.4, speaker: Alex Jung, text: "Issues are worth more than pull requests"}
  - {t: 1030.1, speaker: Alex Jung, text: "In-person events beat AI-written outbound"}
  # Q5: where open source goes
  - {t: 1164.6, speaker: Alex Jung, text: "Maintaining software isn't free, and AI makes it cost real money"}
  - {t: 1253.7, speaker: John Simone, text: "Shared foundations like the Linux kernel matter more, not less"}
  # Q6: first 100 users, starting today
  - {t: 1350.5, speaker: Tim Glaser, text: "If Claude can build it in a day, why would anyone pay you for it?"}
  - {t: 1390.2, speaker: Tim Glaser, text: "Distribution is a moat. Find a hook that stands out."}
  - {t: 1435.3, speaker: Tim Glaser, text: "Be a forward-deployed engineer: solve people's problems for them"}
  - {t: 1537.1, speaker: John Simone, text: "Find the line between what's free and what people will pay for"}

# cuts: moments that don't serve the story (mic checks, setup chatter, stray asides), removed
#       with their captions. `from` / `to` are transcript text: the cut runs from the first word of
#       `from` to the last word of the first `to` after it.
cuts:
  - {from: "And Alex, Co-Founder of Unikraft", to: "Thank you. Cool, cool.", why: "handover from the previous intro"}
  - {from: "Great meeting everybody.", to: "We have a nice crowd here at the nice office.", why: "small talk"}
  - {from: "cool uh i'm tim is it working", to: "is it working um", why: "mic check"}
  - {from: "Is there a button for these?", to: "All right, hi.", why: "mic check"}
  - {from: "Test test.", to: "There we go.", why: "mic check"}
  - {from: "I think we have a very strong lineup today", to: "we have a lot of early stage founders.", why: "filler before the first question"}
  - {from: "Yeah, so...check?", to: "Alright.", why: "mic check"}
  - {from: "Give it a second.", to: "should have read the manual.", why: "mic help"}
  - {from: "You may be entitled", to: "You may be entitled, yeah.", why: "aside"}
