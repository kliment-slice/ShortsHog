# One file per event. Raw footage stays in `content`; this folder holds only
# pipeline files (transcripts/, stills/, shorts.json, renders/).
event: oss-week
date: 2026-10-21
content: content/OSS_WEEK          # raw footage folder, relative to the repo root
fps:             # output fps for renders and Resolve timelines; default 23.976

# Every camera and mic on the shared timeline. Paths are relative to `content`.
# `align.py sync` fills start (timeline second of the file's t=0), duration, sync_peak.
reference: cam1                    # ran the whole event (70.8 min) and hears everyone
sources:
  cam1:
    file: "10_21_2026 Posthog Angle 1.MP4"   # 1920x1080, 25 fps, 70.8 min
    kind: camera
    start: 0.0
    duration: 4249.44
  cam2:
    file: "10_21_2026 Posthog Angle 2.MP4"   # 1920x1080, 23.976 fps, 70.3 min
    kind: camera
    start: -37.1819
    sync_peak: 5.51
    duration: 4216.212
  mic1:                            # one recording split into 30-min files
    kind: mic
    parts:
    - file: "Audio Recordings/Mic 1-1.WAV"
      start: -73.8365
      sync_peak: 2.77
      duration: 1814.665
    - file: "Audio Recordings/Mic 1-2.WAV"
      start: 1742.7365
      sync_peak: 5.57
      duration: 1849.571
    - file: "Audio Recordings/Mic 1-3.WAV"
      start: 3592.3156
      sync_peak: 2.53
      duration: 609.359
  mic2:
    kind: mic
    parts:
    - file: "Audio Recordings/Mic 2-1.wav"
      start: -260.9058
      sync_peak: 3.35
      duration: 1800.153
    - file: "Audio Recordings/Mic 2-2.wav"
      start: 1539.2505
      sync_peak: 8.07
      duration: 1800.15
    - file: "Audio Recordings/Mic 2-3.wav"
      start: 3339.4034
      sync_peak: 6.51
      duration: 891.0
  mic3:
    kind: mic
    parts:
    - file: "Audio Recordings/Mic 3-1.wav"
      start: -235.4445
      sync_peak: 5.49
      duration: 1800.151
    - file: "Audio Recordings/Mic 3-2.wav"
      start: 1564.7093
      sync_peak: 5.77
      duration: 1800.15
    - file: "Audio Recordings/Mic 3-3.wav"
      start: 3364.863
      sync_peak: 5.7
      duration: 850.19
  speaker_feed:                    # 69.8 min; synced for reference, not in the mix
    file: "Audio Recordings/Directly from speaker.m4a"
    kind: audio

# Who is framed how. crop is [x, y, w, h] in the camera's pixels, ideally 9:16.
# Set once per event from the stills (scripts/stills.py).
    start: -52.1962
    sync_peak: 7.59
    duration: 4188.949
speakers: {}

broll:                             # folders and/or files searched for broll_hint matches
- B-roll
- B-roll 2

# Three panels back to back in one recording; one Granola note covers the evening.
# Times are on the shared timeline, which is cam1's own clock (cam1 is the reference),
# read off cam1 frames: seated after the intro -> people stand up.
# mic_speakers: who held each mic in that panel (mics were handed on between panels).
# Until filled, words are labelled with the mic id.
panels:
- id: gtm
  title: "Open Source as a GTM Strategy"
  granola_meeting: "Lessons from Open Source DevTools Founders w/ PostHog, Cline and more"
  people:
  - {name: Kliment Minchev, company: PostHog, role: emcee}
  - {name: Will Wang, company: Clova, role: host}
  - {name: Tim Glaser, company: PostHog, role: co-founder and CEO}
  - {name: John Simone, company: Cline, role: VP Engineering}
  - {name: Alex Jung, company: Unikraft, role: co-founder}
  mics: [mic1, mic2, mic3]
  mix: sum  # plain sum sounds right here (approved)
  seats:    # left -> right in each camera; from who holds the mic up while the transcript says they talk
    cam2: [John Simone, Alex Jung, Tim Glaser, Will Wang]
  framing:  # cam2 reframes at 13:10 (scene cut); the tight framing doesn't show Will
    cam2:
    - start: 0
      init:
        John Simone: [324, 360]
        Alex Jung: [900, 360]
        Tim Glaser: [1344, 336]
    - start: 710
  mic_speakers: {}
  start: 80                        # 1:20
  end: 1655                        # 27:35
- id: ai-security
  title: "Open Source in AI and Cybersecurity"
  granola_meeting: "Lessons from Open Source DevTools Founders w/ PostHog, Cline and more"
  people:
  - {name: Kliment Minchev, company: PostHog, role: host}
  - {name: Mark Percival, company: 1984.vc, role: host}
  - {name: Tom Piccirello, company: PostHog, role: head of Cybersecurity}
  - {name: Justin D'Souza, company: Asymptote Labs, role: co-founder and CEO}
  - {name: Matt Lenhard, company: Vectoral, role: founder}
  mics: [mic1, mic2, mic3]
  mix: sum  # dead mic1 only hears the room (31% of the old mix): left out
  mix_mics: [mic2, mic3]
  seats:  # left -> right in each camera; from who holds the mic up while the transcript says they talk
    cam2: [Mark Percival, Justin D'Souza, Tom Piccirello, Matt Lenhard, Kliment Minchev]
  mic_speakers: {}
  start: 1675                      # 27:55, hosts' intro
  end: 2965                        # 49:25
- id: pmf
  title: "Finding PMF through Open Source"
  granola_meeting: "Lessons from Open Source DevTools Founders w/ PostHog, Cline and more"
  people:
