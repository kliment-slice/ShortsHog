    - file: "Audio Recordings/Mic 2-3.wav"
      start: 3339.4034
      sync_peak: 6.51
      duration: 891.0
  mic3:
    kind: mic
    parts:
    - file: "Audio Recordings/Mic 3-1.wav"
      start: -235.4445
      sync_peak: 5.49
      duration: 1800.151
    - file: "Audio Recordings/Mic 3-2.wav"
      start: 1564.7093
      sync_peak: 5.77
      duration: 1800.15
    - file: "Audio Recordings/Mic 3-3.wav"
      start: 3364.863
