# One file per event. Raw footage stays in `content`; this folder holds only
# pipeline files (transcripts/, stills/, shorts.json, renders/).
event: oss-week
date: 2026-10-21
content: content/OSS_WEEK          # raw footage folder, relative to the repo root
fps:             # optional output fps override; default is the first camera's fps

# Every camera and mic on the shared timeline. Paths are relative to `content`.
# `align.py sync` fills start (timeline second of the file's t=0), duration, sync_peak.
reference: cam1                    # ran the whole event (70.8 min) and hears everyone
sources:
  cam1:
    file: "10_21_2026 Posthog Angle 1.MP4"   # 1920x1080, 25 fps, 70.8 min
    kind: camera
  cam2:
    file: "10_21_2026 Posthog Angle 2.MP4"   # 1920x1080, 23.976 fps, 70.3 min
    kind: camera
  mic1:                            # one recording split into 30-min files
    kind: mic
    speaker: ""
    parts:
      - file: "Audio Recordings/Mic 1-1.WAV"
      - file: "Audio Recordings/Mic 1-2.WAV"
      - file: "Audio Recordings/Mic 1-3.WAV"
  mic2:
    kind: mic
    speaker: ""
    parts:
      - file: "Audio Recordings/Mic 2-1.wav"
      - file: "Audio Recordings/Mic 2-2.wav"
      - file: "Audio Recordings/Mic 2-3.wav"
  mic3:
    kind: mic
    speaker: ""
    parts:
      - file: "Audio Recordings/Mic 3-1.wav"
      - file: "Audio Recordings/Mic 3-2.wav"
      - file: "Audio Recordings/Mic 3-3.wav"
  speaker_feed:                    # 69.8 min; synced for reference, not in the mix
    file: "Audio Recordings/Directly from speaker.m4a"
    kind: audio

# Who is framed how. crop is [x, y, w, h] in the camera's pixels, ideally 9:16.
# Set once per event from the stills (scripts/stills.py).
speakers: {}

broll:                             # folders and/or files searched for broll_hint matches
  - B-roll
  - B-roll 2

panels:
  - id: oss
    granola_meeting: "Lessons from Open Source DevTools Founders w/ PostHog, Cline and more"
    mics: [mic1, mic2, mic3]       # sources mixed for this panel's audio
    start:                         # timeline seconds; empty = span where all its mics record
    end:
