# One file per event. Raw footage stays in `content`; this folder holds only
# pipeline files (transcripts/, stills/, shorts.json, renders/).
event: finance
name: Building the AI-Native Finance Org  # shown on title cards
date: 2026-11-18
content: content/FINANCE           # raw footage folder, relative to the repo root
fps: 30                            # the recording's own rate
caption_highlight: corn_blue       # lemon (the default) disappears into the room's mustard chairs and warm light

# One webinar recording (Chargebee Traceable): a 3-tile grid with the mixed call audio.
# The same file is the camera and the "mic", so both sit at timeline 0; no sync needed.
reference: mic1
sources:
  cam1:
    file: "Building the AI-Native Finance Org.mp4"   # 1920x1080, 30 fps, 31.6 min, tiles: Jeff TL, Sruthi TR, Matt bottom
    kind: camera
    start: 0.0
    duration: 1894.146
  mic1:
    file: "Building the AI-Native Finance Org.mp4"   # the call's mixed audio (stereo, 48 kHz)
    kind: mic
    speaker: ""
    start: 0.0
    duration: 1894.146

# Tiles in cam1 pixels [x, y, w, h] (the whole video tile, name tag included)
speakers:
  "Matt Ghering": {camera: cam1, tile: [508, 548, 906, 486], name_tag: [[528, 892, 220, 68], [528, 964, 334, 50]]}  # the call app's own label: name pill, role pill
  "Sruthi Lanka": {camera: cam1, tile: [968, 46, 908, 486]}
  "Jeff Sant": {camera: cam1, tile: [46, 46, 908, 486]}

broll: []

panels:
- id: ai-finance
  title: "Building the AI-Native Finance Org"
  granola_meeting: "Matt G @ Traceable (Chargebee)"
  people:
  - {name: Jeff Sant, company: Chargebee, role: COO}
  - {name: Sruthi Lanka, company: Public.com, role: CFO}
  - {name: Matt Ghering, company: PostHog, role: Head of Finance}
  mics: [mic1]
  start: 0
  end: 1894.1

# Whisper's mishearings and the speaker labels it wrote into the text
corrections:
- {find: "Sruthi Nepal", replace: ""}
- {find: "Phillip", replace: "", at: 482}
- {find: "Sruthi Lanka", replace: "", at: 492}
- {find: "one account", replace: "one accountant"}
- {find: "clothes", replace: "close"}
- {find: "Anthropik", replace: "Anthropic"}
- {find: "Anthropico", replace: "Anthropic"}
- {find: "Truthy", replace: "Sruthi"}
- {find: "Shruthi", replace: "Sruthi"}
- {find: "RERP", replace: "our ERP"}
- {find: "Ready for Adventure", replace: "ready for adventure"}
- {find: "Moneyline", replace: "MoneyLion"}
- {find: "Fine-tuning", replace: "fine-tuning"}
- {find: "BD+10.", replace: "BD+10,", at: 293}
